name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      # Typecheck, then the tests: they read data/facts.db, so a broken
      # database fails CI the same way a broken extension does.
      - run: npm run check
